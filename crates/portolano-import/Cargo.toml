[package]
name = "portolano-import"
description = "Portolano importers: Importer trait, report, registry and the Royal TS/TSX importer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
portolano-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
quick-xml.workspace = true
base64.workspace = true
flate2.workspace = true
zip.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Type descriptions for the TypeScript bindings of the app (SPEC-UI §3.5).
specta = { workspace = true, optional = true }

[features]
# Derives `specta::Type` on the result types that the app passes to its
# frontend as they are.
specta = ["dep:specta"]

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
