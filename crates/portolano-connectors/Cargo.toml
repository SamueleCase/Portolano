[package]
name = "portolano-connectors"
description = "Portolano connectors: Protocol trait, registry, SSH and RDP launch plans and execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
portolano-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
hex.workspace = true
thiserror.workspace = true
getrandom.workspace = true
zeroize.workspace = true
tempfile.workspace = true
directories.workspace = true
shell-words.workspace = true
regex.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Terminal modes and signal mask of the askpass fallback on `/dev/tty`
# (DEC-028.2, DEC-030): safe wrappers, since `unsafe_code` is denied.
nix = { workspace = true, features = ["term", "signal"] }

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
